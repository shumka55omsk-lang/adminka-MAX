<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Открываем мини-приложение</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f6f2ea;color:#17201f;padding:24px;box-sizing:border-box}
    .box{width:min(440px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 18px 46px rgba(15,23,42,.12);text-align:center}
    .icon{font-size:42px;margin-bottom:8px}.muted{color:#68736f;line-height:1.5}.btn{display:inline-flex;margin-top:16px;padding:14px 18px;border-radius:16px;background:#0f766e;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🟢</div>
    <h1>Открываем заявку</h1>
    <p class="muted">Сейчас откроется мини-приложение для мягких окон.</p>
    <a class="btn" id="fallback" href="/miniapp">Открыть вручную</a>
  </div>
  <script>
    (function(){
      const FLOW = 'measure';
      const TERM = FLOW === 'estimate' ? 'known_sizes' : 'free_measure';
      const params = new URLSearchParams(location.search);
      const pick = (key, fallback) => String(params.get(key) || fallback || '').trim().replace(/[^a-zA-Z0-9_\-а-яА-ЯёЁ]/g, '').slice(0,80) || fallback;
      const campaign = pick('c', 'soft_windows_post');
      const content = pick('p', 'post_1');
      const medium = pick('m', 'max_group');
      const target = new URL('/miniapp', location.origin);
      target.searchParams.set('flow', FLOW);
      target.searchParams.set('mode', FLOW);
      target.searchParams.set('source', 'max_group');
      target.searchParams.set('utm_source', 'max_group');
      target.searchParams.set('utm_medium', medium);
      target.searchParams.set('utm_campaign', campaign);
      target.searchParams.set('utm_content', `${content}_${FLOW}`);
      target.searchParams.set('utm_term', TERM);
      const href = target.toString();
      document.getElementById('fallback').href = href;
      setTimeout(() => location.replace(href), 80);
    })();
  </script>
</body>
</html>
